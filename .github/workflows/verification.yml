name: Verify Package

on:
  push: { branches: ['**'] }
  pull_request: {}

jobs:
  verify:
    name: Verify on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build inplace
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run test scripts
        run: |
          python tests/test_cbc.py
          python tests/test_decrypt.py
          python tests/test_pgmmv.py

      - name: Run command line script
        run: |
          pgmmvdec -e tests/samples/info.json
          pgmmvdec tests/samples
